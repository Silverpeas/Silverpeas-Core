# Files excluded from the administration console and global key search.
# This file is always excluded, even when the list below is empty.
# Changes are read immediately; no server restart is needed.
# One entry per file: exclude.<unique name>=<path relative to the properties directory>
# Use forward slashes. Paths are case-sensitive and matched exactly (no wildcards).
# Examples (uncomment and adapt to your installation):
# exclude.authentication=org/silverpeas/authentication/settings/authenticationSettings.properties
# exclude.custom=customer/private.properties
