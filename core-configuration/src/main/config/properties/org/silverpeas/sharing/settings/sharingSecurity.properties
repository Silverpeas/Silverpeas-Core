# Maximum number of failed verification code attempts allowed per sharing ticket
# during the configured attempt window. Default: 5.
sharing.securityCode.maxAttempts = 5

# Time window, in minutes, during which failed verification attempts are counted.
# Failures older than this window are discarded. Default: 15 minutes.
sharing.securityCode.attemptWindow = 15

# Duration, in minutes, of the temporary lock after the maximum number of
# failed attempts is reached. Even valid codes are rejected while locked.
# Default: 15 minutes.
sharing.securityCode.lockDuration = 15
